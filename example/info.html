        <!DOCTYPE html>
        <html lang="en">

        <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

        <head>
            <meta charset="UTF-8">
            <title>CBUILD - Project Info</title>

            <style>
                body {
                    font-family: monospace;
                    padding: 40px;
                }

                main {
                    max-width: 900px;
                    margin: auto;
                }

                h1 {
                    border-bottom: 1px solid #00ff66;
                    padding-bottom: 10px;
                }

                h2 {
                    margin-top: 35px;
                }

                .grid {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 15px;
                }

                .box {
                    border: 1px solid #00ff66;
                    padding: 20px;
                    border-radius: 7px;
                    display:flex;
                    aling-itens:center;
                    justify-content:center;
                    flex-direction:column;
                }

                .label {
                    opacity: 0.6;
                }

                .value {
                    font-size: 22px;
                    margin-top: 8px;
                }

                footer {
                    margin-top: 40px;
                    opacity: 0.5;
                }
            </style>
        </head>

        <body>

        <main>

            <h1>CBUILD : Visual Information</h1>

            <h2>System</h2>

            <div class="grid">

                <div class="box">
                    <div class="label">KERNEL</div>
                    <div class="value">7.2.4-3-cachyos</div>
                </div>

                <div class="box">
                    <div class="label">COMPILER</div>
                    <div class="value">gcc (GCC) 16.2.1 20260810</div>
                </div>

            </div>

            <h2>Project</h2>

            <div class="grid">

                <div class="box">
                    <div class="label">SIZE</div>
                    <div class="value">48K</div>
                </div>

                <div class="box">
                    <div class="label">LINES</div>
                    <div class="value">105</div>
                </div>

                <div class="box">
                    <div class="label">C FILES</div>
                    <div class="value">2</div>
                </div>

                <div class="box">
                    <div class="label">HEADER FILES</div>
                    <div class="value">1</div>
                </div>

            </div>

            <h2>Charts</h2>

            <div class="box">
                <div class="label">C and Header File Count</div>
                <div id="cEh"></div>
            </div>

            <footer>

            </footer>

        </main>

        </body>

        <script>
            const data = [{
                labels: ["C", "Header"],
                values: [2, 1],
                type: "pie"
            }];

            const layout = {
                height: 400,
                width: 500
            };

            Plotly.newPlot("cEh", data, layout);
        </script>

    </html>
